name: Test language pack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [baseline, rc, alpha]
    env:
      DSH_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.runtime != 'baseline'
        run: npm ci --ignore-scripts --prefix test/runtimes/${{ matrix.runtime }}
      - run: npm run build
      - run: git diff --exit-code -- lib/client.js
      - run: npm test
